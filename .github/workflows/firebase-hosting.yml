# Pubblica l'app su Firebase Hosting (app.bebeans.it) a ogni push su main.
# Serve il segreto FIREBASE_SERVICE_ACCOUNT (chiave JSON di un account di servizio
# con ruolo "Amministratore Firebase Hosting"), in Settings › Secrets and variables › Actions.
name: Pubblica su Firebase Hosting
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: duty-scheduler-bdd9e
          channelId: live
